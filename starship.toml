format = """$env_var$hostname$directory$git_branch$git_status$character"""
add_newline = false

[character]
success_symbol = "[❯](magenta)"
error_symbol = "[❯](bold red)"

[hostname]
ssh_only = true
format = "[→](blue) "

[directory]
style = "cyan"
truncation_length = 5
truncate_to_repo = false

[git_branch]
format = "[$branch]($style) "
style = "purple"

[git_status]
format = '([$ahead_behind]($style) )([$all_status]($style) )'
style = "yellow"
ahead = "▲"

[env_var.ZMX_SESSION]
format = "[$env_value] "
style = ""
